apis:
  - name: Tvarka ATK API
    description: >-
      REST API for Lithuanian eID authentication and qualified electronic signing (QES), with validation, timestamping
      and LTV/archive trust services. OpenAPI 3.1 contract, version 1.3.0, 22 operations across Auth, Sign, Pairing,
      Erasure, Validation, LTV and Well-known. Layered auth - HTTP Basic server-to-server behind an IP allow-list plus
      a per-request ES256 client token for the card-driving device. Webhooks are declared natively in the OpenAPI
      webhooks block (signStatus, HMAC-signed).
