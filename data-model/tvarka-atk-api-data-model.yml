summary: >-
  Two parallel resource families - an authentication request and a signing request - share one
  ceremony shape (create, submit certificate, complete) and one state machine. A third, stateless
  family (validation, timestamp, archive) takes a document in and returns a result without a
  ceremony. Nothing is a collection: every read is a single-resource fetch by requestId, so there
  are no parent/child listing relationships.
