      echoed in error bodies. There are no typed id prefixes.
  - name: pairingToken
    format: opaque
    note: >-
      Short-lived, rotatable handoff token for completing an ATK ceremony on a phone; claimed once
      and then unavailable (409 pairing_already_claimed) or expired (410 pairing_expired).
